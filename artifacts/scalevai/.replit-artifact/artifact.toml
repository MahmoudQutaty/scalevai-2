kind = "web"
previewPath = "/"
title = "ScaleVAI"
description = "ScaleVAI website using Next.js App Router and TypeScript."
version = "1.0.0"
id = "artifacts/scalevai"
router = "path"

[[services]]
name = "web"
paths = ["/", "/api/contact", "/_next/hmr"]
localPort = 18259

[services.development]
run = "pnpm --filter @workspace/scalevai run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/scalevai", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/scalevai", "run", "start"]

[services.production.run.env]
PORT = "18259"
NODE_ENV = "production"

[services.env]
PORT = "18259"
BASE_PATH = "/"
